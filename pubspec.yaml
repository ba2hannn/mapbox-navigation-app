name: rotonomi
description: "Akıllı Rota ve Seyahat Yönetim Uygulaması"
# publish_to: 'none' # Yayın için kaldırıldı
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Mapbox
  mapbox_maps_flutter: ^2.3.0
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^8.0.2
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  
  # Storage
  shared_preferences: ^2.3.3
  
  # Navigation
  url_launcher: ^6.3.1
  
  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
